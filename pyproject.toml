[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-publisher"
version = "0.2.0"
description = "Local AI shorts studio with a web dashboard and direct multi-platform publishing"
requires-python = ">=3.12"
dependencies = [
  "edge-tts>=7.2,<8",
  "requests>=2.32,<3",
  "python-dotenv>=1,<2",
  "Pillow>=10,<13",
  "google-api-python-client>=2.180,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
web = ["fastapi>=0.140,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.20,<1"]
vision = ["onnxruntime>=1.21,<2", "tokenizers>=0.20,<1", "huggingface_hub>=0.30,<3"]

[project.scripts]
shorts = "shorts.cli:main"

[tool.setuptools.packages.find]
include = ["shorts*", "backend*"]

[tool.setuptools.package-data]
shorts = ["*.ps1"]

